{% extends 'base.html' %}

{% block title %}Entrar — {{ NOME_DO_CLUBE }}{% endblock %}

{% block content %}
<div class="container py-5 px-3">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
            <div class="card card-custom p-4 shadow-sm border-0">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.8rem; border-radius: 14px;">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h1 class="h4 fw-bold mb-1 text-dark">Acesso ao Sistema</h1>
                    <p class="text-muted small">Faça login com sua conta de Desbravador ou Diretoria</p>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger rounded-3 p-2 small text-center mb-3">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> Usuário ou senha incorretos.
                    </div>
                {% endif %}

                <form method="POST" action="{% url 'pontuacao:login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label small fw-bold text-secondary">Usuário</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-person-fill"></i></span>
                            <input type="text" name="username" id="id_username" class="form-control" placeholder="Digite seu usuário..." required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label small fw-bold text-secondary">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-key-fill"></i></span>
                            <input type="password" name="password" id="id_password" class="form-control" placeholder="Digite sua senha..." required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-custom-primary w-100 py-2 fs-6 shadow-sm" data-loading-text="Entrando...">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
